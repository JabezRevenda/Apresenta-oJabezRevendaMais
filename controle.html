<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Controle remoto · Revenda Mais</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Montserrat:wght@500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Mesmos tokens de marca do index.html (Revenda Mais design system) */
  :root{
    --brand:#E62446;
    --brand-dark:#B0102C;
    --brand-deep:#7E0A20;

    --ink:#0B0E14;
    --ink-2:#12161F;
    --ink-3:#1A1F2B;
    --ink-4:#232937;

    --tx-inv-hi:#FFFFFF;
    --tx-inv-md:rgba(255,255,255,.62);
    --tx-inv-lo:rgba(255,255,255,.38);

    --pos:#0E7A3C;
    --warn:#E8A317;
    --ln-dark:rgba(255,255,255,.09);

    --r-sm:10px; --r-md:16px; --r-lg:24px; --r-full:999px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--tx-inv-hi);
    font-family:'Roboto',system-ui,sans-serif;
    display:flex;
    flex-direction:column;
    min-height:100dvh;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px; border-bottom:1px solid var(--ln-dark); flex:none;
  }
  .status{display:flex; align-items:center; gap:8px; font-family:'Montserrat',sans-serif; font-size:12px; font-weight:600; letter-spacing:.04em; color:var(--tx-inv-md);}
  .dot{width:8px; height:8px; border-radius:50%; background:var(--tx-inv-lo);}
  .dot.on{background:var(--pos);}
  .idx-btn{
    background:none; border:1px solid var(--ln-dark); color:var(--tx-inv-hi);
    font-family:'Montserrat',sans-serif; font-weight:600; font-size:12.5px; letter-spacing:.03em;
    padding:7px 14px; border-radius:var(--r-full);
  }

  .banner{
    display:none; background:var(--brand-deep); color:#fff; font-family:'Montserrat',sans-serif;
    font-size:13px; font-weight:700; letter-spacing:.02em;
    text-align:center; padding:9px; flex:none;
  }
  .banner.on{display:block;}

  main{flex:1; min-height:0; display:flex; flex-direction:column; padding:22px 22px 8px; overflow:hidden;}
  .count{font-family:'Montserrat',sans-serif; font-size:13px; font-weight:700; color:var(--brand); letter-spacing:.06em;}
  .chapter{
    display:flex; align-items:center; gap:9px;
    font-family:'Montserrat',sans-serif; font-size:11.5px; font-weight:700; color:var(--tx-inv-md);
    text-transform:uppercase; letter-spacing:.12em; margin-top:10px;
  }
  .chapter::before{content:''; width:18px; height:2px; background:var(--brand); border-radius:2px; flex:none;}
  .title{
    font-family:'Poppins',sans-serif; font-weight:700; letter-spacing:-.02em;
    font-size:clamp(22px,6vw,30px); line-height:1.15; margin-top:8px;
  }

  .notes-wrap{flex:1; min-height:0; margin-top:18px; display:flex; flex-direction:column;}
  .notes-label{
    font-family:'Montserrat',sans-serif; font-size:11px; font-weight:700; letter-spacing:.14em;
    text-transform:uppercase; color:var(--tx-inv-lo); margin-bottom:9px;
  }
  .notes{
    flex:1; overflow-y:auto; background:var(--ink-2); border:1px solid var(--ln-dark); border-radius:var(--r-md);
    padding:15px 17px; font-family:'Roboto',sans-serif; font-size:16px; line-height:1.6; color:var(--tx-inv-hi); white-space:pre-wrap;
  }

  .controls{display:flex; gap:10px; padding:14px 18px calc(env(safe-area-inset-bottom,0) + 16px); flex:none;}
  .btn{
    flex:1; border:none; border-radius:var(--r-lg); font-family:'Poppins',sans-serif; font-size:17px; font-weight:600;
    padding:20px 10px; display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn:active{opacity:.8;}
  .btn-prev{background:var(--ink-2); color:var(--tx-inv-hi); border:1px solid var(--ln-dark);}
  .btn-next{background:var(--brand); color:#fff;}
  .btn svg{width:20px; height:20px;}
  .btn:disabled{opacity:.4;}

  .sheet{ position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; z-index:10; }
  .sheet.on{display:block;}
  .sheet-body{
    position:absolute; left:0; right:0; bottom:0; max-height:78vh; background:var(--ink);
    border-top:1px solid var(--ln-dark); border-radius:var(--r-lg) var(--r-lg) 0 0; display:flex; flex-direction:column;
  }
  .sheet-head{display:flex; align-items:center; justify-content:space-between; padding:16px 18px; border-bottom:1px solid var(--ln-dark);}
  .sheet-head b{font-family:'Poppins',sans-serif; font-weight:600; font-size:16px;}
  .sheet-close{background:none; border:none; color:var(--tx-inv-md); font-size:22px; line-height:1; padding:4px 8px;}
  .sheet-list{overflow-y:auto; padding:8px 10px 20px;}
  .sheet-item{
    display:flex; gap:12px; align-items:center; width:100%; text-align:left; background:none; border:none;
    color:var(--tx-inv-hi); font-family:'Roboto',sans-serif; padding:11px 8px; border-radius:var(--r-sm); font-size:15px;
  }
  .sheet-item.cur{background:var(--ink-2); color:var(--brand);}
  .sheet-item .n{font-family:'Montserrat',sans-serif; font-weight:600; font-size:11.5px; color:var(--tx-inv-lo); width:24px; flex:none;}
</style>
</head>
<body>

  <div class="banner" id="banner">Sem conexão — verifique a internet do celular</div>

  <div class="topbar">
    <div class="status"><span class="dot" id="dot"></span><span id="statusTx">conectando…</span></div>
    <button class="idx-btn" id="btnIndex">Todos os slides</button>
  </div>

  <main>
    <div class="count" id="count">— / —</div>
    <div class="chapter" id="chapter">&nbsp;</div>
    <div class="title" id="title">Aguardando a apresentação…</div>

    <div class="notes-wrap">
      <div class="notes-label">Roteiro</div>
      <div class="notes" id="notes">Abra a apresentação (index.html) em qualquer aparelho — ela conecta sozinha aqui.</div>
    </div>
  </main>

  <div class="controls">
    <button class="btn btn-prev" id="btnPrev">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 5l-7 7 7 7"/></svg>
      Anterior
    </button>
    <button class="btn btn-next" id="btnNext">
      Próximo
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>

  <div class="sheet" id="sheet">
    <div class="sheet-body">
      <div class="sheet-head"><b>Pular para…</b><button class="sheet-close" id="sheetClose">&times;</button></div>
      <div class="sheet-list" id="sheetList"></div>
    </div>
  </div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://dpzppenutrateiihqshu.supabase.co';
const SUPABASE_KEY = 'sb_publishable_vE46je7CApv3ou5UYF07MA_-xgmt3QY';
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

const dot = document.getElementById('dot');
const statusTx = document.getElementById('statusTx');
const banner = document.getElementById('banner');
const countEl = document.getElementById('count');
const chapterEl = document.getElementById('chapter');
const titleEl = document.getElementById('title');
const notesEl = document.getElementById('notes');
const sheet = document.getElementById('sheet');
const sheetList = document.getElementById('sheetList');
const btnPrev = document.getElementById('btnPrev');
const btnNext = document.getElementById('btnNext');

let lastRenderedIndex = -1;

function setConnected(ok){
  dot.classList.toggle('on', ok);
  statusTx.textContent = ok ? 'conectado' : 'sem conexão';
  banner.classList.toggle('on', !ok);
}

function renderList(titles, cur){
  sheetList.innerHTML = titles.map((t,i) =>
    '<button class="sheet-item' + (i===cur?' cur':'') + '" data-i="'+i+'">' +
      '<span class="n">' + String(i+1).padStart(2,'0') + '</span><span>' + (t || '(sem título)') + '</span>' +
    '</button>'
  ).join('');
  sheetList.querySelectorAll('.sheet-item').forEach(b => {
    b.addEventListener('click', () => {
      sendCmd('goto', parseInt(b.dataset.i, 10));
      sheet.classList.remove('on');
    });
  });
}

function render(row){
  if(!row) return;
  countEl.textContent = String((row.slide_index ?? 0)+1).padStart(2,'0') + ' / ' + String(row.total ?? 0).padStart(2,'0');
  chapterEl.textContent = row.chapter || ' ';
  titleEl.textContent = row.title || 'Sem título';
  if(row.slide_index !== lastRenderedIndex){
    notesEl.textContent = row.notes || 'Sem roteiro para este slide.';
    notesEl.scrollTop = 0;
    lastRenderedIndex = row.slide_index;
  }
  if(Array.isArray(row.titles) && row.titles.length){
    renderList(row.titles, row.slide_index);
  }
}

async function sendCmd(action, value){
  const { data } = await supabase.from('remote_state').select('cmd_seq').eq('id', 1).single();
  const nextSeq = (data && data.cmd_seq ? data.cmd_seq : 0) + 1;
  await supabase.from('remote_state').update({
    cmd_action: action,
    cmd_value: value === undefined ? null : value,
    cmd_seq: nextSeq
  }).eq('id', 1);
}

async function loadInitial(){
  const { data, error } = await supabase.from('remote_state').select('*').eq('id', 1).single();
  if(!error) render(data);
}

supabase
  .channel('controle-treinamento')
  .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'remote_state', filter: 'id=eq.1' }, payload => {
    render(payload.new);
  })
  .subscribe(status => {
    setConnected(status === 'SUBSCRIBED');
  });

btnPrev.addEventListener('click', () => sendCmd('prev'));
btnNext.addEventListener('click', () => sendCmd('next'));
document.getElementById('btnIndex').addEventListener('click', () => sheet.classList.add('on'));
document.getElementById('sheetClose').addEventListener('click', () => sheet.classList.remove('on'));
sheet.addEventListener('click', e => { if(e.target === sheet) sheet.classList.remove('on'); });

loadInitial();
</script>
</body>
</html>
