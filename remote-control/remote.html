<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Controle remoto</title>
<style>
  :root{
    --bg:#14171B;
    --card:#1D2127;
    --line:rgba(237,238,232,.12);
    --ink:#EDEEE8;
    --ink-soft:#9BA1A8;
    --amber:#DCA55C;
    --amber-ink:#181B20;
    --ok:#6FAE8E;
    --bad:#D97359;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,'Segoe UI',Roboto,sans-serif;
    display:flex;
    flex-direction:column;
    min-height:100dvh;
    overflow:hidden;
  }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 16px; border-bottom:1px solid var(--line); flex:none;
  }
  .status{display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--ink-soft);}
  .dot{width:8px; height:8px; border-radius:50%; background:var(--bad);}
  .dot.on{background:var(--ok);}
  .idx-btn{
    background:none; border:1px solid var(--line); color:var(--ink);
    font-size:13px; padding:6px 12px; border-radius:20px;
  }

  .banner{
    display:none; background:var(--bad); color:#fff; font-size:13px; font-weight:600;
    text-align:center; padding:8px; flex:none;
  }
  .banner.on{display:block;}

  main{flex:1; min-height:0; display:flex; flex-direction:column; padding:18px 20px 8px; overflow:hidden;}
  .count{font-family:ui-monospace,'SF Mono',monospace; font-size:13px; color:var(--amber); letter-spacing:.04em;}
  .chapter{font-size:12.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.08em; margin-top:6px;}
  .title{font-size:clamp(22px,6vw,30px); font-weight:700; line-height:1.15; margin-top:4px;}

  .notes-wrap{flex:1; min-height:0; margin-top:16px; display:flex; flex-direction:column;}
  .notes-label{font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:8px;}
  .notes{
    flex:1; overflow-y:auto; background:var(--card); border:1px solid var(--line); border-radius:10px;
    padding:14px 16px; font-size:16px; line-height:1.55; color:var(--ink);
  }

  .controls{display:flex; gap:10px; padding:12px 16px calc(env(safe-area-inset-bottom,0) + 14px); flex:none;}
  .btn{
    flex:1; border:none; border-radius:12px; font-size:17px; font-weight:700;
    padding:20px 10px; display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn:active{opacity:.75;}
  .btn-prev{background:var(--card); color:var(--ink); border:1px solid var(--line);}
  .btn-next{background:var(--amber); color:var(--amber-ink);}
  .btn svg{width:20px; height:20px;}

  .sheet{
    position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; z-index:10;
  }
  .sheet.on{display:block;}
  .sheet-body{
    position:absolute; left:0; right:0; bottom:0; max-height:78vh; background:var(--bg);
    border-top:1px solid var(--line); border-radius:16px 16px 0 0; display:flex; flex-direction:column;
  }
  .sheet-head{display:flex; align-items:center; justify-content:space-between; padding:14px 18px; border-bottom:1px solid var(--line);}
  .sheet-head b{font-size:15px;}
  .sheet-close{background:none; border:none; color:var(--ink-soft); font-size:22px; line-height:1; padding:4px 8px;}
  .sheet-list{overflow-y:auto; padding:8px 10px 20px;}
  .sheet-item{
    display:flex; gap:12px; align-items:center; width:100%; text-align:left; background:none; border:none;
    color:var(--ink); padding:11px 8px; border-radius:8px; font-size:15px;
  }
  .sheet-item.cur{background:var(--card); color:var(--amber);}
  .sheet-item .n{font-family:ui-monospace,monospace; font-size:12px; color:var(--ink-soft); width:24px; flex:none;}
</style>
</head>
<body>

  <div class="banner" id="banner">Sem conexão com a apresentação — verifique o Wi-Fi</div>

  <div class="topbar">
    <div class="status"><span class="dot" id="dot"></span><span id="statusTx">conectando…</span></div>
    <button class="idx-btn" id="btnIndex">Todos os slides</button>
  </div>

  <main>
    <div class="count" id="count">— / —</div>
    <div class="chapter" id="chapter">&nbsp;</div>
    <div class="title" id="title">Aguardando a apresentação…</div>

    <div class="notes-wrap">
      <div class="notes-label">Roteiro</div>
      <div class="notes" id="notes">Abra a apresentação no notebook pelo endereço mostrado no terminal.</div>
    </div>
  </main>

  <div class="controls">
    <button class="btn btn-prev" id="btnPrev">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 5l-7 7 7 7"/></svg>
      Anterior
    </button>
    <button class="btn btn-next" id="btnNext">
      Próximo
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>

  <div class="sheet" id="sheet">
    <div class="sheet-body">
      <div class="sheet-head"><b>Pular para…</b><button class="sheet-close" id="sheetClose">&times;</button></div>
      <div class="sheet-list" id="sheetList"></div>
    </div>
  </div>

<script>
  const dot = document.getElementById('dot');
  const statusTx = document.getElementById('statusTx');
  const banner = document.getElementById('banner');
  const countEl = document.getElementById('count');
  const chapterEl = document.getElementById('chapter');
  const titleEl = document.getElementById('title');
  const notesEl = document.getElementById('notes');
  const sheet = document.getElementById('sheet');
  const sheetList = document.getElementById('sheetList');

  let lastOk = 0;
  let lastIndex = -1;
  let lastNotesScrollIndex = -1;

  function cmd(action, value){
    fetch('/cmd', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(value === undefined ? {action} : {action, value})
    }).catch(()=>{});
  }

  function renderList(titles, cur){
    sheetList.innerHTML = titles.map((t,i) =>
      '<button class="sheet-item' + (i===cur?' cur':'') + '" data-i="'+i+'">' +
        '<span class="n">' + String(i+1).padStart(2,'0') + '</span><span>' + (t || '(sem título)') + '</span>' +
      '</button>'
    ).join('');
    sheetList.querySelectorAll('.sheet-item').forEach(b => {
      b.addEventListener('click', () => {
        cmd('goto', parseInt(b.dataset.i, 10));
        sheet.classList.remove('on');
      });
    });
  }

  function poll(){
    fetch('/state').then(r => r.json()).then(s => {
      lastOk = Date.now();
      dot.classList.add('on');
      statusTx.textContent = 'conectado';
      banner.classList.remove('on');

      if(typeof s.index === 'number' && s.total){
        countEl.textContent = String(s.index+1).padStart(2,'0') + ' / ' + String(s.total).padStart(2,'0');
      }
      chapterEl.textContent = s.chapter || ' ';
      titleEl.textContent = s.title || 'Sem título';
      if(s.index !== lastNotesScrollIndex){
        notesEl.textContent = s.notes || 'Sem roteiro para este slide.';
        notesEl.scrollTop = 0;
        lastNotesScrollIndex = s.index;
      }
      if(Array.isArray(s.titles) && s.titles.length){
        renderList(s.titles, s.index);
      }
      lastIndex = s.index;
    }).catch(() => {
      if(Date.now() - lastOk > 3000){
        dot.classList.remove('on');
        statusTx.textContent = 'sem conexão';
        banner.classList.add('on');
      }
    });
  }

  document.getElementById('btnPrev').addEventListener('click', () => cmd('prev'));
  document.getElementById('btnNext').addEventListener('click', () => cmd('next'));
  document.getElementById('btnIndex').addEventListener('click', () => sheet.classList.add('on'));
  document.getElementById('sheetClose').addEventListener('click', () => sheet.classList.remove('on'));
  sheet.addEventListener('click', e => { if(e.target === sheet) sheet.classList.remove('on'); });

  setInterval(poll, 700);
  poll();
</script>
</body>
</html>
